# HTTP contracts between services, their generated clients and consumers.
#
# Facts come from `lemma verify`'s extractors: operations from OpenAPI
# documents (spec), routes, client operation tables and calls from code
# (syntax). Operations are named "METHOD /path" with path parameters
# written `{}`. A consumer is "repository:file::Symbol"; a file is
# "repository:file". The changed repository is read at the base and head
# of the change; every other repository at one commit, the same in both.

grammar: http-contracts

relations:
  operation:
    args: [Text, Text]                 # service, operation
    attributes: { method: Text, path: Text }
    sources: [spec]
  parameter:
    args: [Text]                       # operation
    attributes: { name: Text, location: Text }
    sources: [spec]
  required_parameter:
    args: [Text]
    attributes: { name: Text, location: Text }
    sources: [spec]
  request_field:
    args: [Text]
    attributes: { field: Text, leaf: Text }
    sources: [spec]
  required_request_field:
    args: [Text]
    attributes: { field: Text, leaf: Text }
    sources: [spec]
  response_field:
    args: [Text]
    attributes: { field: Text, leaf: Text }
    sources: [spec]
  route:
    args: [Text]                       # service
    attributes: { method: Text, path: Text, file: Text, line: Number }
    sources: [syntax]
  client_operation:
    args: [Text]                       # client
    attributes: { chain: Text, method: Text, path: Text, file: Text, line: Number }
    sources: [syntax]
  client_parameter:
    args: [Text]                       # client
    attributes: { method: Text, path: Text, name: Text, location: Text, file: Text, line: Number }
    sources: [spec]
  calls_path:
    args: [Text]                       # consumer
    attributes: { method: Text, path: Text, file: Text, line: Number }
    sources: [syntax]
  calls_client:
    args: [Text]                       # consumer
    attributes: { chain: Text, file: Text, line: Number }
    sources: [syntax]
  mentions:
    args: [Text]                       # the function it is in, or the file outside functions
    attributes: { name: Text }
    sources: [syntax]
  in_file:
    args: [Text, Text]                 # a consumer or function, its file
    sources: [syntax]
  named:
    args: [Text, Text]                 # a function, its simple name (`update` for `Accounts.update`)
    sources: [syntax]
  imports:
    args: [Text, Text]                 # file, imported file
    sources: [syntax]
  strict_request:
    args: [Text]                       # operation whose request schema forbids unlisted fields
    sources: [spec]
  rejects_unknown_fields:
    args: [Text]                       # service that rejects unknown fields whatever its spec says
    sources: [declared]
  route_schema:
    args: [Text]                       # service
    attributes: { method: Text, path: Text, part: Text, file: Text, schema: Text }
    sources: [syntax]                  # the named schema a route uses for its body or query
  inline_strict_route:
    args: [Text]                       # service
    attributes: { method: Text, path: Text, part: Text }
    sources: [syntax]                  # a route part whose schema, written in place, is strict
  strict_schema:
    args: [Text]                       # file
    attributes: { name: Text }
    sources: [syntax]                  # a schema defined there that rejects unknown keys
  union_member:
    args: [Text]                       # file
    attributes: { union: Text, member: Text }
    sources: [syntax]                  # `*` for a member written in place that is not strict
  part_of_service:
    args: [Text, Text]                 # a consumer's file, the service its code belongs to
    sources: [declared]
  addressed_to:
    args: [Text, Text]                 # a path called in code, a service whose path prefixes it is under
    sources: [syntax, spec]
  public_operation:
    args: [Text]                       # an operation called from outside the workspace
    sources: [declared]
  public_service:
    args: [Text]                       # a service whose operations are all called from outside the workspace
    sources: [declared]

rules:
  # What consumers call, matched against the operations they were written
  # for. A service's own code naming its own operations (route declarations,
  # links to itself) is not a call.
  - references_operation(c, op, f, l) :- calls_path(c, m, p, f, l), operation@base(_, op, m, p).
  - references_operation(c, op, f, l) :- calls_path(c, "*", p, f, l), operation@base(_, op, _, p).
  - references_operation(c, op, f, l) :- calls_client(c, ch, f, l), client_operation(_, ch, m, p, _, _), operation@base(_, op, m, p).
  - own_operation(f, op) :- part_of_service(f, s), operation@base(s, op, _, _).
  - calls(c, op, f, l) :- references_operation(c, op, f, l), !own_operation(f, op).

  # Functions consumer c calls by name: in its own file, and in a file its
  # file imports, where an SDK often keeps the code that builds a request or
  # reads a response (`transformListResponse`).
  - local_callee(c, g) :- in_file(c, f), in_file(g, f), named(g, n), mentions(c, n), c != g.
  - imported_callee(c, g) :- in_file(c, f), imports(f, h), in_file(g, h), named(g, n), mentions(c, n).

  # Evidence that consumer c uses name n, for findings that rest on a use:
  # its own function, the functions it calls in its file or an imported one,
  # or declarations outside functions (schemas, types, constants) in its file
  # or a file its file imports. Functions it does not call do not count; they
  # often reuse common names for other things.
  - uses(c, n) :- mentions(c, n).
  - uses(c, n) :- in_file(c, f), mentions(f, n).
  - uses(c, n) :- in_file(c, f), imports(f, g), mentions(g, n).
  - uses(c, n) :- local_callee(c, g), mentions(g, n).
  - uses(c, n) :- imported_callee(c, g), mentions(g, n).

  # Evidence that consumer c sends name n, for findings that rest on a name
  # being absent from a request: what it uses. A script naming a field in a
  # function the consumer never calls says nothing about the request it sends.
  - sends(c, n) :- uses(c, n).

  # What changed between the base and head of the change. Parameter and
  # field changes count only on operations the change kept; a removed
  # operation is reported once, not once per field it had.
  - removed_operation(op) :- operation@base(s, op, m, p), !operation@head(s, op, m, p).
  - kept_operation(op) :- operation@base(s, op, m, p), operation@head(s, op, m, p).
  - removed_parameter(op, n, loc) :- parameter@base(op, n, loc), !parameter@head(op, n, loc), kept_operation(op).
  - new_required_parameter(op, n, loc) :- required_parameter@head(op, n, loc), !required_parameter@base(op, n, loc), kept_operation(op).
  - removed_request_field(op, fld, leaf) :- request_field@base(op, fld, leaf), !request_field@head(op, fld, leaf), kept_operation(op).
  - new_required_request_field(op, fld, leaf) :- required_request_field@head(op, fld, leaf), !required_request_field@base(op, fld, leaf), kept_operation(op).
  - removed_response_field(op, fld, leaf) :- response_field@base(op, fld, leaf), !response_field@head(op, fld, leaf), kept_operation(op).
  # Route parts whose schema rejects unknown keys (zod's `.strict()`): a
  # strict schema defined in the route's file or a file it imports, or a
  # union of them.
  - strict_in_scope(f, n) :- strict_schema(f, n).
  - strict_in_scope(f, n) :- imports(f, g), strict_schema(g, n).
  - loose_union(f, u) :- union_member(f, u, m), !strict_in_scope(f, m).
  - strict_definition(f, n) :- strict_in_scope(f, n).
  - strict_definition(f, u) :- union_member(f, u, _), !loose_union(f, u).
  - strict_definition(f, u) :- imports(f, g), union_member(g, u, _), !loose_union(g, u).
  - strict_route(s, m, p, part) :- route_schema(s, m, p, part, f, n), strict_definition(f, n).
  - strict_route(s, m, p, part) :- inline_strict_route(s, m, p, part).

  # Operations that fail a request sending a field or parameter they do not
  # know, after the change: by their spec, their route code, or because
  # their service says so.
  - rejects_unknown(op) :- strict_request@head(op).
  - rejects_unknown(op) :- operation@head(s, op, m, p), strict_route(s, m, p, "body").
  - rejects_unknown(op) :- operation@head(s, op, _, _), rejects_unknown_fields(s).
  - rejects_unknown_parameter(op) :- operation@head(s, op, m, p), strict_route(s, m, p, "query").
  - rejects_unknown_parameter(op) :- operation@head(s, op, _, _), rejects_unknown_fields(s).

  # Calls a changed consumer adds to paths under a service's prefixes that
  # the service does not serve. Calls that were already there, paths under
  # no service's prefixes (a consumer's own routes, other APIs), and a
  # service's own code naming paths under its own prefixes, are not the
  # change's doing.
  - served(m, p) :- operation(_, _, m, p).
  - served_path(p) :- operation(_, _, _, p).
  - called_before(c, m, p) :- calls_path@base(c, m, p, _, _).
  - unserved_call(c, m, p, f, l) :- calls_path(c, m, p, f, l), m != "*", !served(m, p), !called_before(c, m, p), addressed_to(p, s), !part_of_service(f, s).
  - unserved_call(c, m, p, f, l) :- calls_path(c, m, p, f, l), m = "*", !served_path(p), !called_before(c, m, p), addressed_to(p, s), !part_of_service(f, s).

  # Spec against code, in the head snapshot.
  - specified(s, m, p) :- operation(s, _, m, p).
  - routed(s, m, p) :- route(s, m, p, _, _).
  # A route declared once may be served at several paths (route aliases);
  # it is in the spec if any of them is.
  - specified_route(s, m, f, l) :- route(s, m, p, f, l), specified(s, m, p).

  # Whether what a change adds is wired up: an operation it adds to a spec
  # is served by a route and called by some consumer, and a route it adds is
  # in the spec. Only additions count, so a system's older gaps stay quiet.
  - served_before(s, m, p) :- operation@base(s, _, m, p).
  - added_operation(s, op, m, p) :- operation@head(s, op, m, p), !served_before(s, m, p).
  - routed_before(s, m, p) :- route@base(s, m, p, _, _).
  - added_route(s, m, p, f, l) :- route@head(s, m, p, f, l), !routed_before(s, m, p).
  # A service whose routes Lemma reads from its code: for any other, a
  # missing route says nothing.
  - reads_routes(s) :- route(s, _, _, _, _).
  # Calls matched against the operations after the change, so a call of an
  # operation the change adds counts. A service's own code is not a caller.
  - calls_at_head(c, op, f, l) :- calls_path(c, m, p, f, l), operation@head(s, op, m, p), !part_of_service(f, s).
  - calls_at_head(c, op, f, l) :- calls_path(c, "*", p, f, l), operation@head(s, op, _, p), !part_of_service(f, s).
  - calls_at_head(c, op, f, l) :- calls_client(c, ch, f, l), client_operation(_, ch, m, p, _, _), operation@head(s, op, m, p), !part_of_service(f, s).
  - called_at_head(op) :- calls_at_head(_, op, _, _).

requirements:
  consumer_calls_unserved_operation:
    when: unserved_call(c, m, p, f, l)
    severity: error
    explain: "{c} now calls {m} {p}, which no service serves ({f}:{l})"

  consumer_calls_removed_operation:
    when: calls(c, op, f, l), removed_operation(op)
    severity: error
    explain: "{c} calls {op}, which no longer exists ({f}:{l})"

  consumer_misses_new_required_parameter:
    when: calls(c, op, f, l), new_required_parameter(op, n, loc)
    severity: error
    explain: "{c} calls {op}, which now requires {loc} parameter `{n}` ({f}:{l})"

  consumer_misses_new_required_field:
    when: calls(c, op, f, l), new_required_request_field(op, fld, leaf), !sends(c, leaf)
    severity: error
    explain: "{c} calls {op}, which now requires `{fld}`; its code never names `{leaf}` ({f}:{l})"

  consumer_sends_removed_parameter:
    when: calls(c, op, f, l), removed_parameter(op, n, loc), uses(c, n), rejects_unknown_parameter(op)
    severity: error
    explain: "{c} calls {op} and uses `{n}`, a {loc} parameter that was removed and that {op} now rejects ({f}:{l})"

  consumer_sends_ignored_parameter:
    when: calls(c, op, f, l), removed_parameter(op, n, loc), uses(c, n), !rejects_unknown_parameter(op)
    severity: warning
    explain: "{c} calls {op} and uses `{n}`, a {loc} parameter that was removed, so {op} now ignores it if sent ({f}:{l})"

  consumer_sends_rejected_field:
    when: calls(c, op, f, l), removed_request_field(op, fld, leaf), uses(c, leaf), rejects_unknown(op)
    severity: error
    explain: "{c} calls {op} and names `{leaf}`; request field `{fld}` was removed and {op} now rejects requests that send it ({f}:{l})"

  consumer_uses_removed_request_field:
    when: calls(c, op, f, l), removed_request_field(op, fld, leaf), uses(c, leaf), !rejects_unknown(op)
    severity: warning
    explain: "{c} calls {op} and names `{leaf}`; request field `{fld}` was removed or renamed, so {op} now ignores it if sent ({f}:{l})"

  consumer_uses_removed_response_field:
    when: calls(c, op, f, l), removed_response_field(op, fld, leaf), uses(c, leaf)
    severity: warning
    explain: "{c} calls {op} and names `{leaf}`; response field `{fld}` was removed or renamed ({f}:{l})"

  consumer_calls_changed_operation:
    when: calls(c, op, f, l), removed_request_field(op, fld, leaf), !sends(c, leaf)
    severity: info
    explain: "{c} calls {op}, whose request field `{fld}` changed; its code never names `{leaf}` ({f}:{l})"

  client_declares_removed_parameter:
    when: client_parameter(cl, m, p, n, loc, f, l), operation@base(_, op, m, p), removed_parameter(op, n, loc)
    severity: error
    explain: "{cl} still declares {loc} parameter `{n}` on {op}, which the service removed ({f}:{l})"

  client_calls_removed_operation:
    when: client_operation(cl, ch, m, p, f, l), operation@base(_, op, m, p), removed_operation(op)
    severity: error
    explain: "{cl} method `{ch}` calls {op}, which no longer exists ({f}:{l})"

  operation_without_route:
    when: added_operation(s, op, m, p), reads_routes(s), !routed(s, m, p)
    severity: warning
    explain: "{s} adds {op} to its spec, but no route in its code serves it"

  route_without_operation:
    when: added_route(s, m, p, f, l), !specified_route(s, m, f, l)
    severity: warning
    explain: "{s} adds a route for {m} {p} ({f}:{l}) that its spec does not declare"

  operation_without_consumer:
    when: added_operation(s, op, m, p), !called_at_head(op), !public_operation(op), !public_service(s)
    severity: warning
    explain: "{s} adds {op}, which no code in the workspace calls; if code outside it does, add \"{op}\" to a graph of lemma.http.public_operation"

  # Informational: public specs leave out internal routes on purpose. A route
  # the change adds is reported by route_without_operation instead.
  route_not_in_spec:
    when: route(s, m, p, f, l), routed_before(s, m, p), !specified_route(s, m, f, l)
    severity: info
    explain: "{s} serves {m} {p} ({f}:{l}) but its spec does not declare it"
