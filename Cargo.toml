[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc1"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
lemma-grammar = { path = "crates/lemma-grammar" }
lemma-http = { path = "crates/lemma-http" }
lemma-index = { path = "crates/lemma-index" }
lemma-lang = { path = "crates/lemma-lang" }
lemma-lang-server = { path = "crates/lemma-lang-server" }
lemma-lm = { path = "crates/lemma-lm" }
lemma-logic = { path = "crates/lemma-logic" }
lemma-store = { path = "crates/lemma-store" }
lemma-lsp = { path = "crates/lemma-lsp" }
lemma-mapped = { path = "crates/lemma-mapped" }
lemma-model = { path = "crates/lemma-model" }
lemma-providers = { path = "crates/lemma-providers" }
lemma-query = { path = "crates/lemma-query" }
lemma-souffle = { path = "crates/lemma-souffle" }
lemma-syntax = { path = "crates/lemma-syntax" }
lemma-verify = { path = "crates/lemma-verify" }
lemma-graph = { path = "crates/lemma-graph" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
json-schema-diff = "0.1.8"
log = "0.4"
lsp-types = "0.95"
memchr = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rayon = "1"
rustc-hash = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
which = "7"
yaml_serde = "0.10"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Doc comments stay short by convention; these would force boilerplate sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
excessive_nesting = "warn"
allow_attributes_without_reason = "warn"

# Stripping runs rust-objcopy, which hangs on some macOS toolchains; the
# release workflow ships unstripped binaries.
[profile.release]
strip = "none"
