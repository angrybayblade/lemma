module"/><rect x="468.6" y="378.0" width="82.8" height="44" class="module"/></g><text x="85" y="464" class="flow-label" text-anchor="middle">false</text><text x="300" y="464" class="flow-label" text-anchor="middle">Place order</text><text x="510" y="464" class="replay-output" text-anchor="middle" data-replay-value="false">false</text><path class="route replay-route" d="M138.1 410.5L163.6 410.5L184.8 392.5L223.0 392.5M211.0 382.5l12 10-12 10M373.0 415.5L395.2 415.5L413.8 396.4L447.1 396.4M435.1 386.4l12 10-12 10"/><path class="replay-arrowheads" d="M211.0 382.5l12 10-12 10M435.1 386.4l12 10-12 10"/><path class="replay-break" d="M398.5 400.0l12 12m0-12-12 12"/><text x="300" y="508" class="flow-label" text-anchor="middle">orders must pass on billing’s retry flag</text></svg>
