<svg xmlns="http://www.w3.org/2000/svg" class="diagram-svg" viewBox="0 0 600 540" fill="none" role="img" aria-labelledby="workflow-flow-title workflow-flow-desc"><title id="workflow-flow-title">A finding in web, the setup behind it, and a declared requirement.</title><desc id="workflow-flow-desc">Three illustrations of the quickstart system, repositories billing and web. A change to billing breaks the call in web, which no one declared. Lemma reads both repositories into one index for the workspace. A requirement flags the call from web to a deprecated operation on billing.</desc><g class="config-scene config-scene--impact"><g class="workflow-pictogram"><path class="route" d="M213.0 243.0L264.0 243.0L306.5 237.0L383.0 237.0"/></g><path class="workflow-arrowheads" d="M371.0 227.0l12 10-12 10"/><path class="workflow-mark" d="M278.2 233.0l14 14m0-14-14 14"/><text x="300" y="190" class="flow-meta" text-anchor="middle">POST /v1/charges</text><g class="workflow-pictogram"><path class="module" d="M87 240l63-27 63 27-63 27z"/></g><text x="150" y="302" class="flow-repository" text-anchor="middle">billing</text><text x="150" y="326" class="flow-meta" text-anchor="middle">Changed its contract</text><g class="workflow-pictogram"><path class="module" d="M387 240l63-27 63 27-63 27z"/></g><text x="450" y="302" class="flow-repository" text-anchor="middle">web</text><text x="450" y="326" class="flow-meta" text-anchor="middle">Call breaks</text><text x="300" y="420" class="flow-label" text-anchor="middle">No link declared. Read from the code.</text></g><g class="config-scene config-scene--setup"><g class="workflow-pictogram"><path class="module" d="M47 130l63-27 63 27-63 27z"/><path class="route" d="M110 157V357H196.4"/></g><text x="110" y="60" class="flow-repository" text-anchor="middle">billing</text><text x="110" y="84" class="flow-meta" text-anchor="middle">mod.lm</text><g class="workflow-pictogram"><path class="module" d="M427 130l63-27 63 27-63 27z"/><path class="route" d="M490 157V357H403.6"/></g><text x="490" y="60" class="flow-repository" text-anchor="middle">web</text><text x="490" y="84" class="flow-meta" text-anchor="middle">mod.lm</text><g class="workflow-pictogram"><path class="module" d="M200.4 343l99.6 -43 99.6 43-99.6 43z"/></g><path class="workflow-arrowheads" d="M184.4 347.0l12 10-12 10M415.6 347.0l-12 10 12 10"/><g class="workflow-brand" transform="translate(300 343) scale(1.5 .9) translate(-300 -316)"><path d="M278 320v-24h24M298 336h24v-24M290 323l20-20"/></g><text x="300" y="456" class="flow-repository" text-anchor="middle">lemma</text><text x="300" y="480" class="flow-meta" text-anchor="middle">One index for the whole workspace</text></g><g class="config-scene config-scene--model"><g class="workflow-pictogram"><path class="route" d="M387.0 237.0L336.0 237.0L293.5 243.0L217.0 243.0"/></g><path class="workflow-arrowheads" d="M229.0 233.0l-12 10 12 10"/><path class="workflow-mark" d="M300 240.0v-38"/><path class="workflow-flag" d="M300 202.0l24 8-24 8z"/><text x="300" y="186" class="flow-meta" text-anchor="middle">POST /v1/charges · deprecated</text><g class="workflow-pictogram"><path class="module" d="M87 240l63-27 63 27-63 27z"/></g><text x="150" y="302" class="flow-repository" text-anchor="middle">billing</text><text x="150" y="326" class="flow-meta" text-anchor="middle">Serves the operation</text><g class="workflow-pictogram"><path class="module" d="M387 240l63-27 63 27-63 27z"/></g><text x="450" y="302" class="flow-repository" text-anchor="middle">web</text><text x="450" y="326" class="flow-meta" text-anchor="middle">Still calls it</text><text x="300" y="420" class="flow-label" text-anchor="middle">Every call to it is flagged</text></g></svg>
