<svg xmlns="http://www.w3.org/2000/svg" width="352" height="352" viewBox="0 0 352 352">
  <defs>
    <filter id="metal-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="metal-recess" cx="36%" cy="30%" r="70%">
      <stop offset="0" stop-color="#101512" stop-opacity=".52"/>
      <stop offset=".52" stop-color="#1B211E" stop-opacity=".32"/>
      <stop offset="1" stop-color="#1B211E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="metal-dimples" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="2.2" fill="url(#metal-recess)"/>
      <path d="M9.7 12.3a1.9 1.9 0 0 0 2.8-.2" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width=".65"/>
    </pattern>
  </defs>
  <rect width="352" height="352" fill="#808080"/>
  <rect width="352" height="352" filter="url(#metal-grain)" opacity=".20"/>
  <rect width="352" height="352" fill="url(#metal-dimples)"/>
</svg>
