# Code quality and unit tests: the three commands CONTRIBUTING.md asks for
# before every commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The documentation site: its copy of the docs is current, it builds, and
  # its routes, anchors and labels hold.
  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The build names the last commit that changed the docs.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 website/scripts/check_content.py
      - run: node website/scripts/build.mjs
      - run: python3 website/scripts/check_docs.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The read-keyed evidence tests watch runs with strace on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y strace
      # Tests that need Soufflé or language servers are ignored by default.
      - run: cargo test --workspace --locked

  # Keep actual proof and mutation checks mandatory without making Z3 a
  # prerequisite for the ordinary offline Rust suite.
  source-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install z3-solver==4.15.4.0
      - run: z3 -version
      - run: cargo test -p lemma-graph --lib --locked proof::tests -- --ignored
      - run: cargo test -p lemma-graph --test source_contracts --locked -- --ignored
