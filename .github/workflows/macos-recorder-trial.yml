# Trial for a macOS recorder (Lemma spec 13, section 10): does eslogger see
# every file operation of a probe with a known answer, and what does the
# injected library miss against it? Results are uploaded as artifacts.
name: macos-recorder-trial

on:
  push:
    branches: [trial/macos-recorder]
  workflow_dispatch:

jobs:
  trial:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Machine
        run: |
          mkdir -p out
          {
            sw_vers; uname -m; csrutil status || true
            sudo -n true && echo "sudo -n: ok"
            sudo -n softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 && echo "rosetta: installed"
            echo "--- full disk access grants"
            sudo -n sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
              "select client, auth_value from access where service = 'kTCCServiceSystemPolicyAllFiles'" || true
            echo "--- runner process tree"
            ps -o pid,ppid,comm -p $$ -p $PPID
            echo "--- eslogger events"
            /usr/bin/eslogger --list-events | tr '\n' ' '
          } 2>&1 | tee out/machine.txt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build
        run: sh trial/build.sh
      - name: "A: probe"
        timeout-minutes: 5
        if: false
        run: sh trial/eslogger.sh out/a "$PWD/trial/probe" /tmp/probe-a
      - name: "A: probe under Rosetta"
        if: false
        timeout-minutes: 5
        run: sh trial/eslogger.sh out/a-x86 "$PWD/trial/probe-x86" /tmp/probe-a-x86
      - name: "A and C together: probe"
        if: false
        timeout-minutes: 5
        run: sh trial/eslogger.sh out/ac sh trial/with-c.sh "$PWD/out/ac/calls" "$PWD/trial/probe" /tmp/probe-ac
      - name: "A: probe as root (openbyid_np)"
        timeout-minutes: 5
        if: false
        run: sh trial/eslogger.sh out/a-root sudo -n "$PWD/trial/probe" /tmp/probe-a-root
      - name: "A: load and drops"
        if: false
        timeout-minutes: 8
        run: sh trial/eslogger.sh out/stress sh trial/stress.sh
      - name: "C: coverage on real test suites"
        if: always()
        timeout-minutes: 20
        run: sh trial/mac.sh "$PWD/out/coverage" 2>&1 | tee out/coverage.txt
      - name: Pack
        if: always()
        run: |
          rm -rf out/coverage/gin out/coverage/flask out/coverage/zustand
          find out -name events.json -exec gzip -9 {} \;
          du -sh out/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-${{ matrix.os }}
          path: out
