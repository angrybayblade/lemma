# Built-in semantic providers, tried in order for each language.
#
# A project can add providers or replace these by id in .lemma/providers.toml
# using the same format. Project entries are tried first. If a provider fails
# to start, the next installed one for the language is tried.
#
#   id                      unique name, used in output and cache keys
#   languages               typescript, tsx, python, go, rust
#   command                 executable name on PATH, or an absolute path
#   args                    command arguments
#   initialization_options  sent during the LSP initialize handshake
#   settings                returned when the server asks for workspace/configuration
#   ready_messages          log messages, or titles of finished progress reports,
#                           meaning the server has loaded the workspace (* matches
#                           anything); Lemma waits for one before asking
#   project_markers         file names marking separate projects the server only
#                           searches once one of their files is open; before a
#                           project-wide question Lemma opens one file in each
#                           project that mentions the symbol
#   install                 how to install it, shown when it is not found

# The server publishes diagnostics and goes quiet before it starts loading
# the project; this progress report ending is the real signal.
[[provider]]
id = "typescript-language-server"
languages = ["typescript", "tsx"]
command = "typescript-language-server"
args = ["--stdio"]
install = "npm install -g typescript typescript-language-server"
ready_messages = ["Initializing JS/TS language features*"]
# A monorepo has many tsconfig projects; references stay inside loaded ones.
project_markers = ["tsconfig.json", "jsconfig.json"]

# TypeScript 7's native compiler has its own server. typescript-language-server
# needs TypeScript 6 or older, so whichever matches the installed TypeScript
# starts; the other fails to start and is skipped.
[[provider]]
id = "typescript-native"
languages = ["typescript", "tsx"]
command = "tsc"
args = ["--lsp", "--stdio"]
project_markers = ["tsconfig.json", "jsconfig.json"]

# Pyright is tried first for Python: compared with ty on one large
# repository it resolved one more call (a classmethod reached through an
# instance of a generic subclass of a metaclass-built class), counts
# imports and `__all__` entries as references, and used less memory; ty
# was much faster.
#
# Pyright answers before it has found the workspace's files, and those
# answers only cover files it already knows. It logs this once it has.
[[provider]]
id = "pyright"
languages = ["python"]
command = "pyright-langserver"
args = ["--stdio"]
install = "npm install -g pyright"
ready_messages = ["Found * source file*", "No source files found*"]

# logLevel keeps the ready message above from being filtered out.
[provider.settings.python.analysis]
diagnosticMode = "openFilesOnly"
logLevel = "Information"

# ty (from Astral) answers in milliseconds once loaded, even on very large
# workspaces, but reads the whole repository into memory. Like the TypeScript servers, it does not count import
# statements as references; pyright does.
[[provider]]
id = "ty"
languages = ["python"]
command = "ty"
args = ["server"]
install = "uv tool install ty"

[[provider]]
id = "basedpyright"
languages = ["python"]
command = "basedpyright-langserver"
args = ["--stdio"]
install = "uv tool install basedpyright"
ready_messages = ["Found * source file*", "No source files found*"]

[provider.settings.basedpyright.analysis]
diagnosticMode = "openFilesOnly"
logLevel = "Information"

[[provider]]
id = "gopls"
languages = ["go"]
command = "gopls"
args = []
install = "go install golang.org/x/tools/gopls@latest"

# rust-analyzer reports progress while it loads the workspace with cargo and
# indexes it; references are complete once indexing ends. Earlier reports,
# such as "Roots Scanned", end before the workspace is loaded.
[[provider]]
id = "rust-analyzer"
languages = ["rust"]
command = "rust-analyzer"
args = []
install = "rustup component add rust-analyzer"
ready_messages = ["Indexing"]
# Each Cargo workspace is a separate project.
project_markers = ["Cargo.toml"]
