[package]
name = "lemma-mapped"
description = "A read-only memory map of a file: the workspace's one use of unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Deliberately not `workspace = true`: the workspace forbids unsafe code,
# and this crate exists to hold the one exception (spec 17).
[lints.rust]
missing_docs = "warn"

[dependencies]
memmap2 = "0.9"

[dev-dependencies]
tempfile.workspace = true
